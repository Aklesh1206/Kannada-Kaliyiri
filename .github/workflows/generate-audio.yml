# Makes one mp3 per phrase with Microsoft's free Kannada voice and commits them to public/audio.
# Run it from GitHub: Actions > "Generate audio" > Run workflow. Re-run whenever you add phrases.
name: Generate audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python scripts/generate_audio.py
      - name: Commit the audio files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add public/audio
          git diff --cached --quiet && echo "No new audio" || (git commit -m "Add generated phrase audio" && git push)
